<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clippeur de film</title>
<style>
  :root {
    --fond: #f6f5f2; --carte: #ffffff; --texte: #1d1c1a; --discret: #6b6862;
    --bord: #e2dfd8; --accent: #c2410c; --accent-texte: #ffffff; --erreur: #b91c1c;
    --piste: #ece9e3; --survol: #faf8f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #161514; --carte: #201f1d; --texte: #ecebe8; --discret: #9c9890;
      --bord: #34322e; --accent: #f97316; --accent-texte: #1a0d04; --erreur: #f87171;
      --piste: #2c2a27; --survol: #262422;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sous-titre { color: var(--discret); margin: 0 0 28px; }
  .carte {
    background: var(--carte); border: 1px solid var(--bord); border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
  }
  .carte h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--discret); margin: 0 0 12px; }
  .ligne { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer;
    border: 1px solid var(--bord); background: var(--carte); color: var(--texte);
  }
  button.principal { background: var(--accent); border-color: var(--accent); color: var(--accent-texte); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select, input[type=search] {
    font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--bord); background: var(--carte); color: var(--texte);
  }
  .chemin { color: var(--discret); word-break: break-all; font-size: 14px; }
  .chemin strong { color: var(--texte); }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--discret); font-size: 14px; }
  .barre { height: 8px; background: var(--piste); border-radius: 99px; overflow: hidden; margin: 12px 0 8px; }
  .barre > div { height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .barre.indeterminee > div { width: 30%; animation: va-et-vient 1.2s ease-in-out infinite alternate; }
  @keyframes va-et-vient { from { margin-left: 0; } to { margin-left: 70%; } }
  .message { font-size: 14px; }
  .journal { color: var(--discret); font-size: 13px; margin: 8px 0 0; padding-left: 18px; }
  .erreur { color: var(--erreur); font-weight: 600; white-space: pre-wrap; }
  .resume { color: var(--discret); margin: 0 0 12px; }
  .repliques { max-height: 60vh; overflow-y: auto; border-top: 1px solid var(--bord); margin-top: 12px; }
  .replique { display: flex; gap: 14px; padding: 8px 4px; border-bottom: 1px solid var(--bord); }
  .replique:hover { background: var(--survol); }
  .heure { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; flex: none; font-size: 14px; padding-top: 1px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Clippeur de film</h1>
  <p class="sous-titre">Étape 1 : transcription horodatée des dialogues, en local.</p>

  <section class="carte">
    <h2>1. Film</h2>
    <div class="ligne">
      <button id="choisir">Choisir un film…</button>
      <span class="chemin" id="chemin">Aucun film choisi.</span>
    </div>
  </section>

  <section class="carte">
    <h2>2. Transcription</h2>
    <div class="ligne">
      <label>Modèle Whisper
        <select id="modele">
          <option value="tiny">tiny (très rapide, peu précis)</option>
          <option value="base">base (rapide)</option>
          <option value="small">small (équilibré)</option>
          <option value="medium">medium (précis, lent)</option>
        </select>
      </label>
      <label><input type="checkbox" id="forcer"> Refaire même si déjà en cache</label>
      <button class="principal" id="lancer" disabled>Lancer la transcription</button>
    </div>
    <p class="journal" style="padding:0;margin-top:10px">Le modèle ne sert que si le film n'a pas de sous-titres français.</p>

    <div id="suivi" hidden>
      <div class="barre" id="barre"><div></div></div>
      <div class="message" id="message"></div>
      <ul class="journal" id="journal"></ul>
      <p class="erreur" id="erreur" hidden></p>
    </div>
  </section>

  <section class="carte" id="resultats" hidden>
    <h2>3. Répliques</h2>
    <p class="resume" id="resume"></p>
    <input type="search" id="filtre" placeholder="Chercher une réplique…" style="width:100%">
    <div class="repliques" id="repliques"></div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  let cheminFilm = null;
  let repliques = [];

  $("modele").value = "{{ modele_par_defaut }}";

  function heure(secondes) {
    const s = Math.floor(secondes);
    return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60]
      .map(n => String(n).padStart(2, "0")).join(":");
  }

  $("choisir").onclick = async () => {
    $("choisir").disabled = true;
    try {
      const r = await (await fetch("/api/choisir", { method: "POST" })).json();
      if (r.chemin) {
        cheminFilm = r.chemin;
        const nom = r.chemin.split(/[\\/]/).pop();
        $("chemin").innerHTML = "";
        const fort = document.createElement("strong");
        fort.textContent = nom;
        $("chemin").append(fort, document.createElement("br"), r.chemin);
        $("lancer").disabled = false;
      }
    } finally {
      $("choisir").disabled = false;
    }
  };

  $("lancer").onclick = async () => {
    const reponse = await fetch("/api/transcrire", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chemin: cheminFilm, modele: $("modele").value, forcer: $("forcer").checked }),
    });
    if (!reponse.ok) {
      afficherErreur((await reponse.json()).erreur);
      return;
    }
    $("resultats").hidden = true;
    suivre();
  };

  function afficherErreur(texte) {
    $("suivi").hidden = false;
    $("erreur").hidden = false;
    $("erreur").textContent = texte;
  }

  async function suivre() {
    const etat = await (await fetch("/api/etat")).json();
    $("suivi").hidden = false;
    $("choisir").disabled = etat.en_cours;
    $("lancer").disabled = etat.en_cours || !cheminFilm;

    const barre = $("barre");
    barre.classList.toggle("indeterminee", etat.en_cours && etat.pourcentage == null);
    barre.firstElementChild.style.width = etat.pourcentage != null ? etat.pourcentage + "%" : (etat.en_cours ? "" : "100%");
    $("message").textContent = (etat.pourcentage != null ? etat.pourcentage.toFixed(1) + " % — " : "") + (etat.message || "");

    $("journal").innerHTML = "";
    for (const ligne of etat.journal || []) {
      const li = document.createElement("li");
      li.textContent = ligne;
      $("journal").append(li);
    }

    $("erreur").hidden = !etat.erreur;
    $("erreur").textContent = etat.erreur || "";

    if (etat.en_cours) {
      setTimeout(suivre, 1000);
    } else if (etat.resultat) {
      afficherResultat(etat.resultat);
    }
  }

  function afficherResultat(resultat) {
    repliques = resultat.segments;
    const duree = repliques.length ? heure(repliques[repliques.length - 1].fin) : "00:00:00";
    $("resume").textContent = `${resultat.film} · ${repliques.length} réplique${repliques.length > 1 ? "s" : ""} · source : ${resultat.source} · dernière réplique à ${duree}`;
    $("filtre").value = "";
    afficherRepliques();
    $("resultats").hidden = false;
  }

  function afficherRepliques() {
    const recherche = $("filtre").value.trim().toLowerCase();
    const conteneur = $("repliques");
    conteneur.innerHTML = "";
    const fragment = document.createDocumentFragment();
    for (const r of repliques) {
      if (recherche && !r.texte.toLowerCase().includes(recherche)) continue;
      const ligne = document.createElement("div");
      ligne.className = "replique";
      const h = document.createElement("span");
      h.className = "heure";
      h.textContent = heure(r.debut);
      const t = document.createElement("span");
      t.textContent = r.texte;
      ligne.append(h, t);
      fragment.append(ligne);
    }
    conteneur.append(fragment);
  }

  $("filtre").oninput = afficherRepliques;

  // Si une transcription tourne déjà (page rechargée), on reprend son suivi.
  fetch("/api/etat").then(r => r.json()).then(etat => { if (etat.en_cours || etat.resultat) suivre(); });
</script>
</body>
</html>
